<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch to Desktop - VerifyFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Fonts Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 1.5rem;
        }
        .container {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1), 0 6px 15px -3px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 100%;
        }
        .icon {
            font-size: 4rem;
            color: #6366f1; /* Indigo */
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 2.25rem; /* text-4xl */
            font-weight: 700; /* font-bold */
            color: #1a202c;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        p {
            font-size: 1.125rem; /* text-lg */
            color: #475569;
            margin-bottom: 1.5rem;
        }
        .contact-link {
            color: #6366f1;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease-in-out;
        }
        .contact-link:hover {
            color: #4338ca;
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            .container {
                padding: 1.5rem;
                border-radius: 0.75rem;
            }
            .icon {
                font-size: 3rem;
                margin-bottom: 1rem;
            }
            h1 {
                font-size: 1.75rem; /* text-3xl */
            }
            p {
                font-size: 1rem; /* text-base */
            }
        }
    </style>
</head>
<body class="antialiased">
    <div class="container">
        <span class="material-icons icon">desktop_windows</span>
        <h1>Please Switch to a Desktop Device</h1>
        <p>This application is currently optimized for desktop viewing and functionality. For the best experience, please access VerifyFlow from a larger screen.</p>
    </div>
</body>
</html>
