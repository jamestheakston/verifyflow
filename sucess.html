<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Verification Successful!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Google Fonts Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            background-color: #ffffff;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1), 0 6px 15px -3px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 90%;
        }
        .icon {
            font-size: 4rem;
            color: #22c55e; /* Green-500 */
            margin-bottom: 1.5rem;
            display: flex; /* Use flex to center the icon */
            justify-content: center;
            align-items: center;
        }
        .icon .material-icons {
            font-size: 4rem; /* Ensure the Material Icon is the same size */
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.125rem;
            color: #475569;
            margin-bottom: 2rem; /* Increased margin-bottom for space */
        }
        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            background-color: #6366f1; /* Indigo-500 */
            color: #ffffff;
            font-weight: 600;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: background-color 0.2s ease-in-out;
        }
        .back-button:hover {
            background-color: #4f46e5; /* Indigo-600 */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <span class="material-icons">check_circle</span>
        </div>
        <h1>Test Verification Successful!</h1>
        <p>Your test email verification event was processed successfully. This page simulates the redirect after a successful verification.</p>
        <a href="dashboard.html" class="back-button">Go back to Dashboard</a>
    </div>
</body>
</html>
